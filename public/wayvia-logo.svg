<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    <linearGradient id="wGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbit Ring -->
  <path d="M 120 250 C 110 320, 240 370, 360 300 C 440 250, 420 180, 300 200 C 190 220, 130 230, 120 250 Z" 
        fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Left Wing of W -->
  <path d="M 125 155 C 160 160, 185 240, 205 320 C 175 325, 140 280, 125 210 C 115 170, 105 160, 125 155 Z" 
        fill="url(#wGrad1)" filter="url(#glow)" />
  
  <!-- Right Wing of W -->
  <path d="M 375 155 C 340 160, 315 240, 295 320 C 325 325, 360 280, 375 210 C 385 170, 395 160, 375 155 Z" 
        fill="url(#wGrad2)" filter="url(#glow)" />

  <!-- Central Map Pin & W Peak -->
  <g transform="translate(250, 180)">
    <!-- Pin Body -->
    <path d="M 0 -70 C 28 -70, 50 -48, 50 -20 C 50 20, 0 70, 0 70 C 0 70, -50 20, -50 -20 C -50 -48, -28 -70, 0 -70 Z" 
          fill="url(#wGrad1)" filter="url(#glow)" />
    <!-- Pin Inner Circle Hole -->
    <circle cx="0" cy="-20" r="18" fill="#080C16" />
  </g>

  <!-- Center-bottom V connection -->
  <path d="M 180 270 L 250 350 L 320 270 C 300 340, 270 380, 250 380 C 230 380, 200 340, 180 270 Z" 
        fill="url(#wGrad2)" filter="url(#glow)" />

  <!-- Airplane soaring top right -->
  <g transform="translate(390, 110) rotate(-35) scale(1.2)">
    <path d="M 0 -35 L 22 25 L 8 18 L 10 32 L 0 25 L -10 32 L -8 18 L -22 25 Z" 
          fill="url(#planeGrad)" filter="url(#glow)" />
  </g>
</svg>
